name: Vercel Production Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Optional comma/space/newline separated list, for example:
      # shopthatdemo.com,www.shopthatdemo.com
      VERCEL_DOMAINS: ${{ secrets.VERCEL_DOMAINS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production deployment
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production build
        id: deploy
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $deployment_url"

      - name: Re-apply production domain aliases
        if: ${{ env.VERCEL_DOMAINS != '' }}
        run: |
          set -euo pipefail
          deployment_url="${{ steps.deploy.outputs.deployment_url }}"
          echo "$VERCEL_DOMAINS" | tr ',[:space:]' '\n' | sed '/^$/d' | while read -r domain; do
            echo "Assigning $domain -> $deployment_url"
            vercel alias set "$deployment_url" "$domain" --token="$VERCEL_TOKEN"
          done
