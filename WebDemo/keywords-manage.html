    <main id="main" class="keywords" role="main">
      <section class="toolbar" aria-label="Keyword management controls">

        </div>
        <div class="toolbar__right">
          <div class="control-group" role="group" aria-label="Keyword actions">

              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

            </button>
            <button id="mk-clear" class="btn btn--secondary" type="button" title="Clear All">

                <polyline points="3,6 5,6 21,6"></polyline>
                <path d="M19,6v14a2,2,0,0,1-2,2H7a2,2,0,0,1-2-2V6m3,0V4a2,2,0,0,1,2-2h4a2,2,0,0,1,2,2v2"></path>

      <!-- Add Keyword Side Panel -->
      <aside class="mk-side-panel" id="mkAddPanel" aria-label="Add keyword" aria-hidden="true">

          <h3>Add Keyword</h3>
          <button class="icon-btn" id="mkPanelClose" aria-label="Close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <div class="mk-side-panel__body">
          <div class="mk-form-group">
            <label class="mk-form-label" for="mkPanelName">Keyword Name</label>
            <input id="mkPanelName" class="mk-form-input" type="text" placeholder="Enter keyword name" />
          </div>
          <div class="mk-form-group">
            <label class="mk-form-label" for="mkPanelLevel">Level</label>
            <select id="mkPanelLevel" class="mk-form-select">
              <option value="1">Top Level</option>
              <option value="2">Connected</option>
              <option value="3">Secondary</option>
              <option value="4">Isolated</option>
            </select>
          </div>
          <div class="mk-form-group">
            <label class="mk-form-label">Connect To</label>
            <input id="mkPanelConnSearch" class="mk-form-input" type="text" placeholder="Search keywords to connect..." />
            <div class="mk-conn-chips" id="mkPanelSelectedConns"></div>
            <div class="mk-conn-results" id="mkPanelConnResults"></div>
          </div>
        </div>
        <div class="mk-side-panel__footer">
          <button class="btn btn--secondary" id="mkPanelCancel">Cancel</button>
          <button class="btn btn--primary" id="mkPanelSave">Save Keyword</button>
        </div>
      </aside>
      <div class="mk-side-panel-overlay" id="mkPanelOverlay"></div>

      <!-- Clear All Warning Modal (inserted by JS) -->
    </main>

    <script>
      // Back button functionality - use browser history to preserve previous state
      document.addEventListener('DOMContentLoaded', function() {
        const backBtn = document.getElementById('backBtn');
        if (backBtn) {
          backBtn.addEventListener('click', function(e) {
            e.preventDefault();
            history.back();
          });
        }
        
        // Dark mode functionality
        const darkModeToggle = document.getElementById('darkModeToggle');
        const body = document.body;
        
        // Check for saved dark mode preference
        const isDarkMode = localStorage.getItem('darkMode') === 'true';
        if (isDarkMode) {
          body.classList.add('dark-mode');
        }
        
        // Toggle dark mode
        if (darkModeToggle) {
          darkModeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            const isNowDark = body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isNowDark);
          });
        }
      });
    </script>
